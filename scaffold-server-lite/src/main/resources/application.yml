server:
  port: 8080

spring:
  application:
    name: scaffold-server-lite
  datasource:
    # H2 内存库：每次重启清空（本地跑数据/联调定位）；要持久化改为
    # jdbc:h2:file:./data/lite 并加 DB_CLOSE_ON_EXIT=FALSE
    url: jdbc:h2:mem:lite;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # lite 形态用 ddl-auto 建表；接 MySQL/生产改 validate + Liquibase
      ddl-auto: update
    open-in-view: false

scaffold:
  data:
    # 单机形态固定 worker-id，多实例部署前必须区分
    worker-id: 1
    datacenter-id: 1
  job:
    # simple 引擎：@Job 注解扫描注册；接入 PowerJob 时改为 none 并引入 starter-powerjob
    engine: simple
    pool-size: 2

logging:
  level:
    com.scaffold: info
