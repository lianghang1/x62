server:
  port: 8080

spring:
  application:
    name: scaffold-server-lite
  datasource:
    # H2 内存库：每次重启清空（本地跑数据/联调定位）；要持久化改为
    # jdbc:h2:file:./data/lite 并加 DB_CLOSE_ON_EXIT=FALSE
    url: jdbc:h2:mem:lite;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # lite 形态用 ddl-auto 建表；接 MySQL/生产改 validate + Liquibase
      ddl-auto: update
    open-in-view: false

scaffold:
  data:
    # 单机形态固定 worker-id，多实例部署前必须区分
    worker-id: 1
    datacenter-id: 1
  job:
    # simple 引擎：@Job 注解扫描注册；接入 PowerJob 时改为 none 并引入 starter-powerjob
    engine: simple
    pool-size: 2

logging:
  level:
    com.scaffold: info

# ==================== data-link 采集端（module-cemlink） ====================
# 不配置 cemlink.source.url 时采集端整体不装配，lite 仍是纯本地形态
cemlink:
  park-code: zqqy
  watermark-db-path: ./linkora/cemlink-watermark.db
  upload-path: ./uploadFile
  collect:
    page-size: 200
  source:
    url: ${PARK_DB_URL:}
    username: ${PARK_DB_USER:}
    password: ${PARK_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

# linkora 上行客户端：本地 sqlite 队列，先落库再发送、断线补发
linkora:
  client:
    enabled: false
    server-url: ${ERP_SERVER_URL:}
    client-id: ${LINKORA_CLIENT_ID:}
    db-path: ./linkora/linkora-client.db
    payload-cipher: true
    payload-cipher-key: ${LINKORA_PAYLOAD_CIPHER_KEY:}
    store: sqlite
