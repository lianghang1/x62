server:
  port: 8080

spring:
  application:
    name: scaffold-server
  profiles:
    active: dev
  # springdoc/knife4j 兼容性（Boot 2.6+ 推荐配置）
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  liquibase:
    # dev 用 H2 + ddl-auto；生产/信创 profile 覆盖为 true（changeset 见 db/changelog）
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.xml

scaffold:
  data:
    # 多实例部署时各节点必须不同（环境变量注入）
    worker-id: 1
    datacenter-id: 1
  web:
    access-log-enabled: true
    xss:
      # XSS 过滤默认开启（参数与 body 尖括号转义）；富文本接口用 exclude-urls 排除
      enabled: true
      exclude-urls: []
    cors:
      # 默认关闭；需要跨域时填写来源白名单
      allowed-origins: []
  security:
    internal-whitelist:
      - /internal/auth/login
      - /internal/auth/captcha
    openapi-whitelist: []
    online-whitelist: []
    token-ttl-seconds: 604800
    renew-threshold-percent: 20
    password-policy:
      # 连续失败锁定 + 密码强度（创建账号/改密时用 PasswordPolicyValidator 校验）
      max-fail-count: 5
      lock-seconds: 900
      min-length: 8
      require-letter-and-digit: true
    ip-guard:
      # 登录 IP 维度防撞库：同 IP 窗口内失败达上限后拒绝该 IP 账密登录
      enabled: true
      fail-limit: 30
      window-seconds: 600
    captcha:
      # internal 登录图形验证码：off | always | after_fail（连续失败 N 次后强制）
      mode: after_fail
      fail-threshold: 3
      ttl-seconds: 120
  job:
    engine: simple
    pool-size: 4
  crypto:
    # AES（默认）| SM4（国密/信创）；生产/信创环境必须用环境变量覆盖默认 key
    type: ${SCAFFOLD_CRYPTO_TYPE:AES}
    key: ${SCAFFOLD_CRYPTO_KEY:dev-only-key-change-me}
  powerjob:
    # PowerJob 适配器开关；启用前先看 README「接入 PowerJob」三步
    enabled: false
  push:
    # SSE 实时推送；多实例部署时置 multi-instance=true（Redis pub/sub 扇出）
    enabled: true
    heartbeat-seconds: 30
    multi-instance: false
  ws:
    # WebSocket 双向通道默认关闭（SSE 覆盖大部分场景），需要双向通信时开启
    enabled: false
    path: /online/ws
  http:
    # 出站 HTTP 客户端（okhttp），业务面向 ScaffoldHttpClient
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    retry-max-attempts: 2
  cache:
    type: two-level
    l1-ttl-seconds: 60
    l2-ttl-seconds: 3600
  message:
    sms-guard:
      # 短信防刷（防短信轰炸/配额盗刷）：间隔 + 手机号日限 + IP 日限 + 全局日配额
      enabled: true
      phone-interval-seconds: 60
      phone-daily-limit: 10
      ip-daily-limit: 50
      global-daily-limit: 1000

# PowerJob worker 本体（官方 starter 默认启用，这里默认关闭；接入见 README 与 prod profile）
powerjob:
  worker:
    enabled: false

knife4j:
  enable: true

logging:
  config: classpath:logback-spring.xml
